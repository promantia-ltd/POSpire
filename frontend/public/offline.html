<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="robots" content="noindex" />
		<title>POSpire — Offline</title>
		<style>
			/* Inlined; NO external requests, NO JS. Must render with JS disabled. */
			:root {
				color-scheme: light;
				--primary: #0097a7;
				--bg: #ffffff;
				--fg: #1a1a1a;
				--muted: #555;
				--border: #e0e0e0;
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				margin: 0;
				padding: 0;
				height: 100%;
				background: var(--bg);
				color: var(--fg);
				font-family:
					-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell,
					"Open Sans", "Helvetica Neue", sans-serif;
				-webkit-font-smoothing: antialiased;
			}
			body {
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 24px;
			}
			main {
				max-width: 480px;
				width: 100%;
				text-align: center;
				padding: 32px 24px;
				border: 1px solid var(--border);
				border-radius: 12px;
				box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
			}
			.mark {
				display: inline-block;
				width: 56px;
				height: 56px;
				border-radius: 50%;
				background: var(--primary);
				color: #fff;
				line-height: 56px;
				font-size: 28px;
				font-weight: 700;
				margin-bottom: 16px;
			}
			h1 {
				margin: 0 0 8px;
				font-size: 22px;
				font-weight: 600;
			}
			p {
				margin: 0 0 12px;
				color: var(--muted);
				line-height: 1.5;
			}
			.hint {
				margin-top: 20px;
				padding-top: 16px;
				border-top: 1px solid var(--border);
				font-size: 13px;
				color: var(--muted);
			}
		</style>
	</head>
	<body>
		<main role="main">
			<div class="mark" aria-hidden="true">!</div>
			<h1>You are offline.</h1>
			<p>Please reconnect to continue.</p>
			<p class="hint">
				POSpire hasn&rsquo;t been loaded on this device yet. Once the connection is restored and the
				app has loaded a single time, you can keep using it through short offline windows.
			</p>
		</main>
	</body>
</html>
